<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinco minutos contigo 🌷</title>

    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

    <main class="entrada">

        <!-- Estrellas del cielo -->
        <div class="estrellas" aria-hidden="true">
            <span>✦</span>
            <span>·</span>
            <span>✧</span>
            <span>·</span>
            <span>✦</span>
            <span>·</span>
        </div>

        <!-- Luna -->
        <div class="luna" aria-hidden="true"></div>

        <!-- Contenido principal -->
        <section class="contenido">

            <p class="para">Para usted, Sofia</p>

            <h1>
                Cinco minutos
                <span>contigo</span>
            </h1>

            <p class="mensaje">
                No tiene que hacer nada aquí<br>
                solo quédese un ratito
            </p>

            <button id="btnComenzar" class="boton">
                <span>🌷</span>
                Quedarme un ratito
            </button>

        </section>

        <!-- Tulipanes decorativos -->
        <div class="tulipanes" aria-hidden="true">
            <span>🌷</span>
            <span>🌷</span>
            <span>🌷</span>
        </div>

    </main>

    <script src="apss.js"></script>

</body>
</html>
